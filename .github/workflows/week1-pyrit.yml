name: Week 1 protected PyRIT regressions

on:
  push:
    branches:
      - integration/week-01
  pull_request:
    branches:
      - release/week-01

jobs:
  pyrit-regressions:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyRIT
        run: python -m pip install 'pyrit==1.1.0'
      - name: Protected PyRIT regression tests
        run: python -m unittest -v attack_engine.test_run_pyrit_local attack_engine.test_pyrit_runner_errors attack_engine.test_pyrit_adapter
