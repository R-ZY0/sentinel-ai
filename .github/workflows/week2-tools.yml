name: Week 2 attack tools

on:
  push:
    branches:
      - integration/week-02
  pull_request:
    branches:
      - release/week-02

jobs:
  tool-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [garak, pyrit]

    env:
      PYTHONPATH: .:backend
      LOCAL_TARGET_MODE: protected
      OLLAMA_BASE_URL: http://127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install selected tool dependencies
        run: >-
          python -m pip install
          -r attack_engine/requirements-${{ matrix.tool }}.txt

      - name: Run garak regression tests
        if: matrix.tool == 'garak'
        run: >-
          python -m unittest
          attack_engine.test_garak_conversation_adapter
          attack_engine.test_garak_conversation_transport
          attack_engine.test_garak_execution_bridge
          attack_engine.test_garak_report_adapter
          attack_engine.test_probe_mapping
          attack_engine.test_week2_contract_bridge
          attack_engine.test_garak_runner
          attack_engine.test_garak_protected_target -v

      - name: Run PyRIT regression tests
        if: matrix.tool == 'pyrit'
        run: >-
          python -m unittest
          attack_engine.test_run_pyrit_local
          attack_engine.test_pyrit_runner_errors
          attack_engine.test_pyrit_adapter
          attack_engine.test_attack_library_runner -v